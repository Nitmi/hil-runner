[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embedded-hil-runner"
version = "0.2.0"
description = "Cooperative leases and bounded native execution for embedded HIL workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nitmi" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.11", "jsonschema>=4.23"]

[project.scripts]
hil-runner = "hil_runner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hil_runner"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "hil_runner/schemas"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
